name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_ID: com.dror.sensorrx      # change for another project

jobs:
  # 1. Compile and package -------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/SensorReceiver.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SensorReceiver-apk
          path: out/SensorReceiver.apk

  # 2. Install and run on an Android emulator ------------------------------
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: SensorReceiver-apk
          path: out

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke test on emulator (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator-smoke-test.sh out/SensorReceiver.apk ${{ env.APP_ID }} 15

      - name: Keep screenshots and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-results
          path: |
            smoke-*.png
            smoke-logcat.txt
          if-no-files-found: ignore

  # 3. Publish only when the emulator test passed --------------------------
  release:
    needs: emulator-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SensorReceiver-apk
          path: out

      # Latest APK as a GitHub Release: open the repo's Releases page on the phone and tap it.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="sensor-receiver-latest"
          gh release delete "$TAG" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" out/SensorReceiver.apk -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Sensor Receiver (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Passed the emulator smoke test. Download SensorReceiver.apk on the phone and tap it to install."

      # Also keep the APK on a branch, so it can be fetched with plain git.
      - name: Save APK to apk-builds branch
        run: |
          cd out
          git init -q -b apk-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add SensorReceiver.apk
          git commit -q -m "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk-builds
